<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>VoiceChat</title>

  <link
    rel="stylesheet"
    href="style.css"
  >
</head>

<body>

  <!-- =====================================================
       AUTH SCREEN
  ====================================================== -->

  <section id="authScreen" class="screen">

    <div class="auth-card">

      <div class="logo">
        📞
      </div>

      <h1>VoiceChat</h1>

      <p class="subtitle">
        Connect with your friends by voice.
      </p>

      <input
        id="emailInput"
        type="email"
        placeholder="Email address"
        autocomplete="email"
      >

      <input
        id="passwordInput"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        id="loginBtn"
        class="primary-btn"
      >
        Login
      </button>

      <button
        id="registerBtn"
        class="secondary-btn"
      >
        Create Account
      </button>

      <p
        id="authMessage"
        class="auth-message"
      ></p>

    </div>

  </section>


  <!-- =====================================================
       APP SCREEN
  ====================================================== -->

  <section
    id="appScreen"
    class="screen hidden"
  >

    <header class="topbar">

      <div>
        <h1>📞 VoiceChat</h1>

        <span
          id="currentUserText"
          class="current-user"
        >
          Loading...
        </span>
      </div>

      <div class="topbar-actions">

        <button
          id="notificationBtn"
          class="small-btn"
        >
          🔔 Enable Notifications
        </button>

        <button
          id="logoutBtn"
          class="logout-btn"
        >
          Logout
        </button>

      </div>

    </header>


    <main class="main-container">

      <!-- =================================================
           USERS
      ================================================== -->

      <section class="panel">

        <div class="panel-header">

          <div>
            <h2>People</h2>

            <p>
              Select someone to start a voice call.
            </p>
          </div>

        </div>

        <div
          id="usersList"
          class="users-list"
        >
          <p class="empty">
            Loading users...
          </p>
        </div>

      </section>


      <!-- =================================================
           CALL HISTORY
      ================================================== -->

      <section class="panel">

        <div class="panel-header">

          <div>
            <h2>Call History</h2>

            <p>
              Your recent calls.
            </p>
          </div>

          <button
            id="refreshHistoryBtn"
            class="small-btn"
          >
            🔄 Refresh
          </button>

        </div>

        <div
          id="historyList"
          class="history-list"
        >
          <p class="empty">
            Loading history...
          </p>
        </div>

      </section>

    </main>

  </section>


  <!-- =====================================================
       INCOMING CALL OVERLAY
  ====================================================== -->

  <div
    id="incomingOverlay"
    class="call-overlay hidden"
  >

    <div class="call-card incoming-card">

      <div
        id="incomingAvatar"
        class="large-avatar"
      >
        U
      </div>

      <h2 id="incomingName">
        User
      </h2>

      <p class="call-label">
        Incoming voice call...
      </p>

      <div class="call-actions">

        <button
          id="acceptCallBtn"
          class="accept-btn"
        >
          📞 Accept
        </button>

        <button
          id="rejectCallBtn"
          class="reject-btn"
        >
          ❌ Reject
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       OUTGOING CALL OVERLAY
  ====================================================== -->

  <div
    id="outgoingOverlay"
    class="call-overlay hidden"
  >

    <div class="call-card">

      <div
        id="outgoingAvatar"
        class="large-avatar"
      >
        U
      </div>

      <h2 id="outgoingName">
        User
      </h2>

      <p
        id="outgoingStatus"
        class="call-label"
      >
        Calling...
      </p>

      <div class="ring-animation">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <button
        id="cancelCallBtn"
        class="end-btn"
      >
        📵 Cancel Call
      </button>

    </div>

  </div>


  <!-- =====================================================
       ACTIVE CALL OVERLAY
  ====================================================== -->

  <div
    id="activeCallOverlay"
    class="call-overlay hidden"
  >

    <div class="call-card active-card">

      <div
        id="activeAvatar"
        class="large-avatar"
      >
        U
      </div>

      <h2 id="activeName">
        User
      </h2>

      <p
        id="callStatus"
        class="call-label connected"
      >
        Connected
      </p>

      <div
        id="callTimer"
        class="call-timer"
      >
        00:00
      </div>

      <audio
        id="remoteAudio"
        autoplay
        playsinline
      ></audio>

      <div class="active-controls">

        <button
          id="muteBtn"
          class="control-btn"
        >
          🎤 Mute
        </button>

        <button
          id="speakerBtn"
          class="control-btn"
        >
          🔊 Speaker
        </button>

        <button
          id="endCallBtn"
          class="end-btn"
        >
          📵 End Call
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       RINGTONE
  ====================================================== -->

  <audio
    id="ringtone"
    src="ringtone.mp3"
    preload="auto"
    loop
  ></audio>


  <!-- =====================================================
       APP JAVASCRIPT
  ====================================================== -->

  <script
    type="module"
    src="app.js"
  ></script>

</body>
</html>
