<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>VoiceChat</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <!-- =====================================================
       AUTH SCREEN
  ====================================================== -->

  <section id="authScreen" class="screen">

    <div class="auth-card">

      <div class="logo">
        🎙️
      </div>

      <h1>VoiceChat</h1>

      <p class="subtitle">
        Connect with people using voice calls.
      </p>

      <div id="loginForm">

        <input
          id="emailInput"
          type="email"
          placeholder="Email"
          autocomplete="email"
        >

        <input
          id="passwordInput"
          type="password"
          placeholder="Password"
          autocomplete="current-password"
        >

        <button id="loginBtn" class="primary-btn">
          Login
        </button>

        <button id="registerBtn" class="secondary-btn">
          Create Account
        </button>

        <p id="authMessage" class="message"></p>

      </div>

    </div>

  </section>


  <!-- =====================================================
       APP
  ====================================================== -->

  <section id="appScreen" class="screen hidden">

    <header class="topbar">

      <div>
        <h2>🎙️ VoiceChat</h2>
        <span id="currentUserText"></span>
      </div>

      <button id="logoutBtn" class="small-btn">
        Logout
      </button>

    </header>


    <main class="app-content">

      <!-- USERS -->

      <section class="panel">

        <div class="panel-header">

          <div>
            <h3>People</h3>
            <p>Choose someone to call.</p>
          </div>

        </div>

        <div id="usersList" class="users-list">
          <p class="empty">
            Loading users...
          </p>
        </div>

      </section>


      <!-- HISTORY -->

      <section class="panel">

        <div class="panel-header">

          <div>
            <h3>Call History</h3>
            <p>Your recent calls.</p>
          </div>

          <button id="refreshHistoryBtn" class="small-btn">
            Refresh
          </button>

        </div>

        <div id="historyList" class="history-list">
          <p class="empty">
            Loading history...
          </p>
        </div>

      </section>

    </main>

  </section>


  <!-- =====================================================
       OUTGOING CALL
  ====================================================== -->

  <div id="outgoingOverlay" class="call-overlay hidden">

    <div class="call-card">

      <div class="call-avatar" id="outgoingAvatar">
        👤
      </div>

      <h2 id="outgoingName">
        Calling...
      </h2>

      <p id="outgoingStatus">
        Calling...
      </p>

      <button id="cancelCallBtn" class="danger-btn">
        Cancel Call
      </button>

    </div>

  </div>


  <!-- =====================================================
       INCOMING CALL
  ====================================================== -->

  <div id="incomingOverlay" class="call-overlay hidden">

    <div class="call-card">

      <div class="call-avatar" id="incomingAvatar">
        👤
      </div>

      <h2 id="incomingName">
        Incoming Call
      </h2>

      <p>
        Someone is calling you...
      </p>

      <div class="call-actions">

        <button id="acceptCallBtn" class="accept-btn">
          📞 Accept
        </button>

        <button id="rejectCallBtn" class="danger-btn">
          ❌ Reject
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       ACTIVE CALL
  ====================================================== -->

  <div id="activeCallOverlay" class="call-overlay hidden">

    <div class="call-card active-call">

      <div class="call-avatar" id="activeAvatar">
        👤
      </div>

      <h2 id="activeName">
        In Call
      </h2>

      <p id="callStatus">
        Connected
      </p>

      <div id="callTimer">
        00:00
      </div>

      <div class="call-controls">

        <button id="muteBtn" class="control-btn">
          🎤 Mute
        </button>

        <button id="speakerBtn" class="control-btn">
          🔊 Speaker
        </button>

        <button id="endCallBtn" class="danger-btn">
          ☎️ End
        </button>

      </div>

    </div>

  </div>


  <!-- =====================================================
       AUDIO
  ====================================================== -->

  <audio
    id="remoteAudio"
    autoplay
    playsinline
  ></audio>


  <!-- =====================================================
       JAVASCRIPT
  ====================================================== -->

  <script type="module" src="app.js"></script>

</body>
</html>
